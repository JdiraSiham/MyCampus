<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template}">
<head>
    <title>Nouvelle réservation de matériel - MyCampus</title>
</head>
<body>
<section layout:fragment="content">
    <h2>Nouvelle réservation de matériel</h2>

    <div class="alert alert-danger" th:if="${erreur}" th:text="${erreur}"></div>

    <div class="alert alert-warning" th:if="${#lists.isEmpty(materiels)}">
        Aucun matériel n'est disponible pour le moment.
    </div>

    <form th:action="@{/reservations-materiel/reserver}" method="post" class="col-md-6"
          th:unless="${#lists.isEmpty(materiels)}">
        <div class="mb-3">
            <label class="form-label" for="materielId">Matériel *</label>
            <select class="form-select" id="materielId" name="materielId" required>
                <option value="">-- Choisir un matériel --</option>
                <option th:each="m : ${materiels}" th:value="${m.id}"
                        th:text="${m.nom + ' (' + m.reference + ')'}"
                        th:selected="${m.id == materielId}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" for="dateDebut">Début *</label>
            <input type="datetime-local" class="form-control" id="dateDebut" name="dateDebut"
                   th:value="${dateDebut}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label" for="dateFin">Fin *</label>
            <input type="datetime-local" class="form-control" id="dateFin" name="dateFin"
                   th:value="${dateFin}" required/>
        </div>

        <button type="submit" class="btn btn-primary">Réserver</button>
        <a class="btn btn-secondary" th:href="@{/reservations-materiel/mes-reservations}">Annuler</a>
    </form>
</section>
</body>
</html>
