<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template}">
<head>
    <title>Signaler une panne - MyCampus</title>
</head>
<body>
<section layout:fragment="content">
    <h2>Signaler une panne</h2>

    <div class="alert alert-success" th:if="${succes}" th:text="${succes}"></div>
    <div class="alert alert-danger" th:if="${erreur}" th:text="${erreur}"></div>

    <div class="alert alert-warning" th:if="${#lists.isEmpty(materiels)}">
        Aucun matériel n'est disponible pour un signalement.
    </div>

    <form th:action="@{/signalements/signaler}" method="post" class="col-md-6"
          th:unless="${#lists.isEmpty(materiels)}">
        <div class="mb-3">
            <label class="form-label" for="materielId">Matériel *</label>
            <select class="form-select" id="materielId" name="materielId" required>
                <option value="">-- Choisir un matériel --</option>
                <option th:each="m : ${materiels}" th:value="${m.id}"
                        th:text="${m.nom + ' (' + m.reference + ')'}"
                        th:selected="${m.id == materielId}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" for="description">Description de la panne *</label>
            <textarea class="form-control" id="description" name="description" rows="3"
                      th:text="${description}" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Signaler</button>
        <a class="btn btn-secondary" th:href="@{/signalements}">Annuler</a>
    </form>
</section>
</body>
</html>
