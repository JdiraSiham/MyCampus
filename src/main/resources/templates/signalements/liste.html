<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template}">
<head>
    <title>Pannes - MyCampus</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center">
        <h2>Signalements de panne</h2>
        <a class="btn btn-primary" th:href="@{/signalements/nouveau}">Signaler une panne</a>
    </div>

    <div class="alert alert-success" th:if="${succes}" th:text="${succes}"></div>
    <div class="alert alert-danger" th:if="${erreur}" th:text="${erreur}"></div>

    <form class="row g-2 mb-3" method="get" th:action="@{/signalements}">
        <div class="col-md-6 col-lg-3">
            <select class="form-select" name="statut">
                <option value="">Tous les statuts</option>
                <option value="EN_ATTENTE" th:selected="${statutChoisi?.name() == 'EN_ATTENTE'}">En attente</option>
                <option value="VALIDEE" th:selected="${statutChoisi?.name() == 'VALIDEE'}">Validée</option>
                <option value="REFUSEE" th:selected="${statutChoisi?.name() == 'REFUSEE'}">Refusée</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Filtrer</button>
            <a class="btn btn-secondary" th:href="@{/signalements}">Réinitialiser</a>
        </div>
    </form>

    <p class="text-muted small mb-2"><span th:text="${#lists.size(signalements)}">0</span> signalement(s)</p>

    <table class="table">
        <thead>
        <tr>
            <th>Matériel</th>
            <th>Description</th>
            <th>Signalé par</th>
            <th>Date</th>
            <th>Statut</th>
            <th>Décision</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${signalements}">
            <td th:text="${s.materiel.nom}"></td>
            <td th:text="${s.description}"></td>
            <td th:text="${s.auteur.nom + ' ' + s.auteur.prenom}"></td>
            <td th:text="${#temporals.format(s.dateSignalement, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
                <span th:switch="${s.statut.name()}">
                    <span th:case="'EN_ATTENTE'" class="badge bg-warning text-dark">En attente</span>
                    <span th:case="'VALIDEE'">
                        <span class="badge bg-success" th:if="${s.resolu}">Résolue</span>
                        <span class="badge bg-primary" th:unless="${s.resolu}">Validée</span>
                    </span>
                    <span th:case="'REFUSEE'" class="badge bg-danger">Refusée</span>
                </span>
            </td>
            <td>
                <span th:if="${s.decideur != null}" th:text="${s.decideur.nom + ' ' + s.decideur.prenom}"></span>
                <div class="text-muted small" th:if="${s.motifRefus != null}" th:text="${s.motifRefus}"></div>
                <div class="text-muted small" th:if="${s.resoluPar != null}"
                     th:text="'Clôturée par ' + ${s.resoluPar.nom} + ' ' + ${s.resoluPar.prenom}"></div>
            </td>
            <td>
                <!-- Demande d'étudiant à traiter -->
                <th:block th:if="${s.statut.name() == 'EN_ATTENTE'}">
                    <form class="d-inline" th:action="@{/signalements/valider}" method="post">
                        <input type="hidden" name="id" th:value="${s.id}"/>
                        <button type="submit" class="btn btn-sm btn-primary"
                                onclick="return confirm('Valider cette panne ? Le matériel passera en panne et ses réservations à venir seront annulées.');">Valider</button>
                    </form>
                    <form class="d-flex gap-1 mt-1" th:action="@{/signalements/refuser}" method="post">
                        <input type="hidden" name="id" th:value="${s.id}"/>
                        <input type="text" class="form-control form-control-sm" name="motif"
                               placeholder="Motif du refus *" required/>
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Refuser ce signalement ?');">Refuser</button>
                    </form>
                </th:block>

                <!-- Panne confirmée, matériel réparé : clôture -->
                <form class="d-inline"
                      th:if="${s.statut.name() == 'VALIDEE' and !s.resolu}"
                      th:action="@{/signalements/cloturer}" method="post">
                    <input type="hidden" name="id" th:value="${s.id}"/>
                    <button type="submit" class="btn btn-sm btn-primary"
                            onclick="return confirm('Clôturer ce signalement ?');">Clôturer</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(signalements)}">
            <td colspan="7" class="text-center text-muted">Aucun signalement trouvé.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
