<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template}">
<head>
    <title>Salle - MyCampus</title>
</head>
<body>
<section layout:fragment="content">
    <h2 th:text="${salleId == null} ? 'Nouvelle salle' : 'Modifier la salle'"></h2>

    <div class="alert alert-danger" th:if="${erreur}" th:text="${erreur}"></div>

    <form th:action="@{/salles/enregistrer}" th:object="${salle}" method="post" class="col-md-6">
        <input type="hidden" name="id" th:if="${salleId != null}" th:value="${salleId}"/>

        <div class="mb-3">
            <label class="form-label" for="nom">Nom *</label>
            <input type="text" class="form-control" id="nom" th:field="*{nom}" required/>
            <div class="text-danger small" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="capacite">Capacité *</label>
            <input type="number" min="1" class="form-control" id="capacite" th:field="*{capacite}" required/>
            <div class="text-danger small" th:if="${#fields.hasErrors('capacite')}" th:errors="*{capacite}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="localisation">Localisation</label>
            <input type="text" class="form-control" id="localisation" th:field="*{localisation}"/>
        </div>

        <div class="mb-3">
            <label class="form-label" for="equipements">Équipements</label>
            <textarea class="form-control" id="equipements" rows="2" th:field="*{equipements}"></textarea>
        </div>

        <div class="mb-3">
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="necessiteValidation"
                       th:field="*{necessiteValidation}"/>
                <label class="form-check-label" for="necessiteValidation">
                    Les réservations de cette salle doivent être validées par un gestionnaire
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a class="btn btn-secondary" th:href="@{/salles}">Annuler</a>
    </form>
</section>
</body>
</html>
