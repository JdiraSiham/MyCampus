<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template}">
<head>
    <title>Mot de passe - MyCampus</title>
</head>
<body>
<section layout:fragment="content">
    <h2>Changer mon mot de passe</h2>

    <div class="alert alert-danger" th:if="${erreur}" th:text="${erreur}"></div>
    <div class="alert alert-success" th:if="${succes}" th:text="${succes}"></div>

    <form th:action="@{/mot-de-passe}" method="post" class="col-md-5">
        <div class="mb-3">
            <label class="form-label" for="ancienMotDePasse">Ancien mot de passe</label>
            <input type="password" class="form-control" id="ancienMotDePasse"
                   name="ancienMotDePasse" required/>
        </div>

        <div class="mb-3">
            <label class="form-label" for="nouveauMotDePasse">Nouveau mot de passe</label>
            <input type="password" class="form-control" id="nouveauMotDePasse"
                   name="nouveauMotDePasse" required/>
        </div>

        <div class="mb-3">
            <label class="form-label" for="confirmation">Confirmer le nouveau mot de passe</label>
            <input type="password" class="form-control" id="confirmation"
                   name="confirmation" required/>
        </div>

        <button type="submit" class="btn btn-primary">Modifier</button>
    </form>
</section>
</body>
</html>
